global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: papilio-collector
    static_configs:
      - targets: [collector:9464]
# For native Outbox lag, add the application's explicitly exposed Prometheus
# endpoint as another scrape target. Its address/authentication belong to the
# host deployment, not the library or this optional local stack.
